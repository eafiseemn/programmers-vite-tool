<!DOCTYPE html>
<html lang="ko-KR">
	<head>
		<title>Momo 📒</title>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/momo-logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/src/reset.css" />
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<div id="app">
			<div id="container">
				<header class="header">
					<h1>
						<img src="/momo-logo.png" alt="momo" />
						<span>🐹</span>
					</h1>
				</header>
				<main>
					<article class="memo">
						<header class="memo-header">
							<span class="badge">MEDIUM</span>
							<button type="button" class="delete">
								<img src="/trash.svg" alt="삭제 아이콘" />
							</button>
						</header>
						<div class="contents">
							<h2>Title Area</h2>
							<p>Description Area 안녕하세요 여기는 설명칸입니다~</p>
						</div>
						<footer class="memo-footer">
							<img src="/user.svg" alt="유저 아이콘" />
							<span class="hit">0</span>
							<span>WATCH</span>
							<img src="/drag.svg" alt="드래그 아이콘" />
						</footer>
					</article>
				</main>
				<footer class="footer">
					<button type="button" class="create">
						<img src="/plus.svg" alt="추가 아이콘" />
					</button>
				</footer>
			</div>
		</div>
	</body>
</html>
